name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolate the trusted Node runtime from the writable runner cache
        shell: bash
        run: |
          set -euo pipefail
          source_node="$(command -v node)"
          runtime_dir="$(mktemp -d "$HOME/.assistant-central-node.XXXXXX")"
          install -m 700 -- "$source_node" "$runtime_dir/node"
          cmp -- "$source_node" "$runtime_dir/node"
          "$runtime_dir/node" --version
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Install pinned fixture dependencies
        run: python -m pip install -r prototypes/consent-v29/requirements-mcp-offline.txt
      - name: Verify public import
        run: python -B tools/verify_import.py
      - name: Check team coordinator
        run: python -B team/run_checks.py
      - name: Check durable synthetic execution boundary
        run: python -B execution/run_checks.py
      - name: Exercise synthetic execution restart and disclosure demo
        run: python -B execution/demo.py
      - name: Exercise owner-specific provider disclosure rehearsal
        run: python -B execution/provider_demo.py
      - name: Check exact team-to-proposal mapping
        run: python -B integration/run_checks.py
      - name: Exercise fictional team-to-proposal wire demo
        run: python -B integration/demo.py
      - name: Check execution result to unsigned proposal composition
        run: python -B execution/check_composition.py
      - name: Check consent and protocol prototype
        run: python -B prototypes/consent-v29/verify_checkpoint.py --full
      - name: Check targeted synthetic stdio path
        run: python -I -B "$GITHUB_WORKSPACE/prototypes/synthetic-stdio-r5/run_all_checks.py"
