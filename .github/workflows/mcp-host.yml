name: MCP host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mcp-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r pilot/requirements.txt -r mission_approvals/requirements.txt
      - name: Mission approvals and assistant conversation tools through the official MCP client
        run: python -B -m unittest discover -s mission_approvals/tests -v
      - name: Owner questions and the Telegram adapter (fake Bot API, no network)
        run: python -B -m unittest discover -s owner_phone/tests -t . -v
