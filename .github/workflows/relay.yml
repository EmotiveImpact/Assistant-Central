name: Relay checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install -r relay/requirements-local.txt
      - name: Relay over a real local HTTP server
        working-directory: relay
        run: python -B -m unittest discover -s tests -t . -v
