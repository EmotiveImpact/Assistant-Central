name: Pilot container isolation
on:
  pull_request:
    paths:
      - 'pilot/**'
      - 'isolation/**'
      - '.github/workflows/pilot-isolation.yml'
  push:
    branches: [main, 'feat/pilot-isolation-harness']
    paths:
      - 'pilot/**'
      - 'isolation/**'
      - '.github/workflows/pilot-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the harness guards
        run: python -B -m unittest discover -s isolation/tests -v
      - name: Exercise actual container and UID boundaries
        run: python -B -m isolation.run --output "$RUNNER_TEMP/pilot-isolation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-isolation-evidence
          path: ${{ runner.temp }}/pilot-isolation.json
          if-no-files-found: error
          retention-days: 14
